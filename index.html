<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Selector de Pokémon</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="favicon.png" type="image/png">

</head>
<body>
  <div class="avatar-enemigo">
  <img src="./teamro.jpg" alt="Entrenador enemigo">
</div>


  <div class="selector-container">
    <label for="pokemon">Elige un Pokémon:</label>
    <select class="pokemon" id="pokemon">
      <option value="">Selecciona...</option>
      <option value="pikachu">Pikachu</option>
      <option value="charmander">Charmander</option>
      <option value="bulbasaur">Bulbasaur</option>
      <option value="squirtle">Squirtle</option>
    </select>
  </div>

  <div class="battle-container">
    <div class="imagenpokemon" id="imagen"></div>
    <p class="resultado" id="resultado"></p>
    <div class="imagenpokemon" id="imagen-enemigo"></div>
  </div>

  <!-- NUEVO: Trofeos y mensaje final -->
  <div id="trofeos-container" class="trofeos"></div>
  <p id="mensaje-final" class="mensaje-final"></p>
  <button id="reiniciar" class="boton-reiniciar">Reiniciar juego</button>


  <script src="main.js"></script>
<button id="boton-musica" class="boton-musica">🔊</button>

<audio id="musica" loop>
  <source src="musica.mp3" type="audio/mpeg">
</audio>


</body>
</html>
